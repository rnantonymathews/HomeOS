<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="HomeOS - Minimalist entertainment launcher and web desktop">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeOS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/homeos.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <title>HomeOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Full Matte Black Wallpaper Canvas -->
  <div class="wallpaper-container desktop-background" id="desktop">
    <div class="matte-texture"></div>
  </div>

  <!-- Luxury Bento Dashboard Cluster (Matched to Reference Design) -->
  <main class="bento-dashboard" id="bento-dashboard" role="main" aria-label="HomeOS Dashboard">
    
    <!-- LEFT COLUMN -->
    <div class="bento-col bento-col-left">
      
      <!-- 1. Music Player Card -->
      <div class="bento-card card-music" id="card-music">
        <div class="card-glow glow-amber"></div>
        <div class="music-top-row">
          <div class="music-info">
            <span class="music-title" id="music-title">After Hours</span>
            <span class="music-artist" id="music-artist">The Weeknd</span>
          </div>
          <div class="music-equalizer" id="equalizer">
            <span class="eq-bar eq-1"></span>
            <span class="eq-bar eq-2"></span>
            <span class="eq-bar eq-3"></span>
            <span class="eq-bar eq-4"></span>
          </div>
        </div>

        <div class="music-progress-wrapper" id="music-progress-wrapper">
          <div class="music-progress-bar">
            <div class="music-progress-fill" id="music-progress-fill" style="width: 32%;"></div>
            <div class="music-scrubber" id="music-scrubber" style="left: 32%;"></div>
          </div>
        </div>

        <div class="music-controls">
          <button class="music-btn" id="btn-prev" title="Previous Track" aria-label="Previous Track">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
          </button>
          
          <button class="music-btn play-btn" id="btn-play" title="Play/Pause" aria-label="Play Track">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="play-icon">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>
          
          <button class="music-btn" id="btn-next" title="Next Track" aria-label="Next Track">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
          
          <button class="music-btn airplay-btn" id="btn-airplay" title="Audio Output" aria-label="Audio Output">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 17a9 9 0 0 1 14 0"/>
              <path d="M8.5 13.5a5 5 0 0 1 7 0"/>
              <circle cx="12" cy="18" r="1.5" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 2. User Profile Greeting Card ("Hi, Aaron Antony") -->
      <div class="bento-card card-greeting" id="card-greeting">
        <div class="card-glow glow-crimson"></div>
        <div class="greeting-content">
          <div class="greeting-salutation">Hi,</div>
          <div class="greeting-user">
            <span class="user-first">Aaron</span>
            <span class="user-last">Antony</span>
          </div>
        </div>

        <div class="greeting-pills-row">
          <div class="user-avatar-badge" title="Aaron Antony">
            <div class="avatar-circle">AA</div>
          </div>
          <button class="bento-pill" id="pill-movies">Movies</button>
          <button class="bento-pill" id="pill-shows">Shows</button>
          <button class="bento-pill pill-accent" id="pill-music">Music</button>
        </div>
      </div>

      <!-- 3. Market / Stats Card (Bottom Left) -->
      <div class="bento-card card-stats" id="card-stats">
        <div class="card-glow glow-green-subtle"></div>
        <div class="stats-left">
          <span class="stats-label">HomeOS Activity</span>
          <span class="stats-sub">System Performance</span>
        </div>
        <div class="stats-graph-wrapper">
          <svg viewBox="0 0 80 28" class="sparkline-svg">
            <path d="M2,18 Q12,8 24,16 T48,12 T64,4 T78,10" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="stats-numbers">
          <span class="stats-val">34,418</span>
          <span class="stats-delta">▲ 10.87</span>
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="bento-col bento-col-right">

      <!-- 4. Tall Weather Card -->
      <div class="bento-card card-weather" id="card-weather">
        <div class="card-glow glow-cyan"></div>
        <div class="weather-top">
          <span class="weather-city-name" id="weather-city">Ejipura</span>
          <span class="weather-humidity-text" id="weather-humidity">Humidity 72%</span>
        </div>

        <div class="weather-temp-row">
          <span class="weather-big-temp" id="weather-temp">18°</span>
        </div>

        <div class="weather-condition-label" id="weather-condition">Partly cloudy</div>
        <div class="weather-range-label" id="weather-range">L: 16° &nbsp; H: 28°</div>

        <div class="weather-forecast-row">
          <div class="forecast-day">
            <span class="forecast-name">Fri</span>
            <div class="forecast-icon">⛅</div>
          </div>
          <div class="forecast-day">
            <span class="forecast-name">Sat</span>
            <div class="forecast-icon">🌧️</div>
          </div>
          <div class="forecast-day">
            <span class="forecast-name">Sun</span>
            <div class="forecast-icon">⛈️</div>
          </div>
        </div>
      </div>

      <!-- 5. Date / Calendar Card -->
      <div class="bento-card card-date" id="card-date">
        <div class="card-glow glow-white-specular"></div>
        <div class="date-content-row">
          <span class="date-big-num" id="date-day">06</span>
          <div class="date-text-stack">
            <span class="date-weekday" id="date-weekday">Monday</span>
            <span class="date-month" id="date-month">July</span>
          </div>
        </div>
      </div>

    </div>

  </main>

  <script src="app.js"></script>
</body>

</html>
