<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1f29">
  <meta name="description" content="HomeOS - Minimalist entertainment launcher and web desktop">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeOS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/homeos.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>HomeOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Dynamic Crossfading Wallpaper Layers -->
  <div class="wallpaper-container desktop-background" id="desktop">

    <div class="wallpaper-layer" id="wallpaper-layer-b"></div>
  </div>
  <canvas id="sky-canvas" class="sky-canvas"></canvas>

  <script src="sky.js"></script>
  <script src="wallpaper.js"></script>
  <script src="app.js"></script>

</html>
