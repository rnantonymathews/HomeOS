<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1f29">
  <meta name="description" content="HomeOS - Minimalist entertainment launcher and web desktop">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeOS">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/homeos.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>HomeOS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Dynamic Crossfading Wallpaper Layers -->
  <div class="wallpaper-container desktop-background" id="desktop">
    <div class="wallpaper-layer active" id="wallpaper-layer-a"></div>
    <div class="wallpaper-layer" id="wallpaper-layer-b"></div>
  </div>
  <canvas id="sky-canvas" class="sky-canvas"></canvas>

  <!-- Spatial Floating Navigation Capsule (VisionOS & B&O Inspired) -->
  <main class="spatial-nav-container" id="spatial-nav" role="navigation" aria-label="HomeOS Primary Navigation">
    <div class="spatial-nav-island" id="spatial-island">
      
      <!-- Liquid Glass Glide Indicator (Slides behind active item) -->
      <div class="spatial-glide-indicator" id="nav-indicator"></div>

      <!-- 1. Movies -->
      <button class="spatial-nav-item active" data-category="movies" id="btn-movies" aria-label="Movies">
        <div class="spatial-glow glow-movies"></div>
        <div class="spatial-icon-wrapper">
          <img src="assets/icons/movies.svg" alt="Movies" class="spatial-icon">
        </div>
        <span class="spatial-label">Movies</span>
      </button>

      <div class="spatial-nav-divider"></div>

      <!-- 2. Shows -->
      <button class="spatial-nav-item" data-category="shows" id="btn-shows" aria-label="Shows">
        <div class="spatial-glow glow-shows"></div>
        <div class="spatial-icon-wrapper">
          <img src="assets/icons/shows.svg" alt="Shows" class="spatial-icon">
        </div>
        <span class="spatial-label">Shows</span>
      </button>

      <div class="spatial-nav-divider"></div>

      <!-- 3. Music -->
      <button class="spatial-nav-item" data-category="music" id="btn-music" aria-label="Music">
        <div class="spatial-glow glow-music"></div>
        <div class="spatial-icon-wrapper">
          <img src="assets/icons/music.svg" alt="Music" class="spatial-icon">
        </div>
        <span class="spatial-label">Music</span>
      </button>

    </div>
  </main>

  <script src="sky.js"></script>
  <script src="wallpaper.js"></script>
  <script src="app.js"></script>
</body>

</html>
