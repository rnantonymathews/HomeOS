<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="glyph-white-tv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E2EC"/>
    </linearGradient>

    <linearGradient id="tv-screen-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.20)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <filter id="glyph-shadow-tv" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#glyph-shadow-tv)">
    <!-- Retro/Modern Dual Antenna -->
    <path d="M21,7 L31,18 M43,7 L33,18" stroke="url(#glyph-white-tv)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="21" cy="7" r="1.8" fill="url(#glyph-white-tv)"/>
    <circle cx="43" cy="7" r="1.8" fill="url(#glyph-white-tv)"/>

    <!-- Television Frame -->
    <rect x="7" y="16" width="50" height="36" rx="7" fill="url(#tv-screen-glass)" stroke="url(#glyph-white-tv)" stroke-width="2.4"/>

    <!-- Screen Bezel Inset -->
    <rect x="11" y="20" width="42" height="28" rx="4" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>

    <!-- Play / Signal Centerpiece -->
    <polygon points="28,28 38,34 28,40" fill="url(#glyph-white-tv)"/>

    <!-- Live indicator dot -->
    <circle cx="48" cy="24" r="1.5" fill="#38BDF8"/>

    <!-- TV Stand -->
    <path d="M24,56 L40,56 M32,52 L32,56" stroke="url(#glyph-white-tv)" stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
