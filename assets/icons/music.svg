<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="glyph-white-music" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E2EC"/>
    </linearGradient>

    <filter id="glyph-shadow-music" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#glyph-shadow-music)">
    <!-- Harmonic Equalizer Wave Bars on left and right -->
    <line x1="8" y1="36" x2="8" y2="44" stroke="url(#glyph-white-music)" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
    <line x1="13" y1="30" x2="13" y2="48" stroke="url(#glyph-white-music)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    
    <line x1="51" y1="30" x2="51" y2="48" stroke="url(#glyph-white-music)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
    <line x1="56" y1="36" x2="56" y2="44" stroke="url(#glyph-white-music)" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>

    <!-- Left Note Head (Rotated Oval) -->
    <ellipse cx="23" cy="46" rx="6.5" ry="5" transform="rotate(-20, 23, 46)" fill="url(#glyph-white-music)"/>

    <!-- Right Note Head (Rotated Oval) -->
    <ellipse cx="43" cy="41" rx="6.5" ry="5" transform="rotate(-20, 43, 41)" fill="url(#glyph-white-music)"/>

    <!-- Left Vertical Stem -->
    <rect x="27" y="19" width="3.2" height="28" rx="1.6" fill="url(#glyph-white-music)"/>

    <!-- Right Vertical Stem -->
    <rect x="47" y="14" width="3.2" height="28" rx="1.6" fill="url(#glyph-white-music)"/>

    <!-- Top Beamed Bridge (Double Bar) -->
    <polygon points="27,19 50.2,14 50.2,20.5 27,25.5" fill="url(#glyph-white-music)"/>
    <polygon points="27,28 50.2,23 50.2,27.5 27,32.5" fill="url(#glyph-white-music)" opacity="0.85"/>
  </g>
</svg>
