<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Crisp Metallic White-to-Silver Gradient -->
    <linearGradient id="glyph-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E2EC"/>
    </linearGradient>

    <!-- Translucent Frosted Glass Tint for Clapper Body -->
    <linearGradient id="clapper-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.06)"/>
    </linearGradient>

    <!-- Ambient Shadow for Legibility on Light/Dark Wallpapers -->
    <filter id="glyph-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#glyph-shadow)">
    <!-- Clapper Top Arm (Angled) -->
    <g transform="rotate(-12, 10, 18)">
      <rect x="7" y="10" width="48" height="10" rx="3" fill="url(#glyph-white)"/>
      <!-- Diagonal Slanted Stripes -->
      <polygon points="14,10 20,10 16,20 10,20" fill="#181D26"/>
      <polygon points="26,10 32,10 28,20 22,20" fill="#181D26"/>
      <polygon points="38,10 44,10 40,20 34,20" fill="#181D26"/>
      <polygon points="50,10 54,10 52,20 46,20" fill="#181D26"/>
    </g>

    <!-- Clapper Main Body -->
    <rect x="9" y="21" width="46" height="34" rx="5" fill="url(#clapper-glass)" stroke="url(#glyph-white)" stroke-width="2.2"/>

    <!-- Slanted Stripes on Lower Rim -->
    <polygon points="15,22 21,22 17,29 11,29" fill="url(#glyph-white)"/>
    <polygon points="27,22 33,22 29,29 23,29" fill="url(#glyph-white)"/>
    <polygon points="39,22 45,22 41,29 35,29" fill="url(#glyph-white)"/>
    <polygon points="51,22 54,22 53,29 47,29" fill="url(#glyph-white)"/>

    <!-- Cinematic Play Glyph in Center -->
    <polygon points="28,34 40,41 28,48" fill="url(#glyph-white)"/>
  </g>
</svg>
